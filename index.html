<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Spotify Room</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    min-height: 100vh;
    background: radial-gradient(circle at 50% 20%, #080808 0%, #595252 45%, #080808 100%);
    color: white;
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
}

.title-card,
.playlist-card {
    background: linear-gradient(145deg, rgba(52, 48, 48, 0.98), rgba(25, 25, 25, 0.96));
    padding: 40px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow:
        0 15px 30px rgba(0, 0, 0, 0.45),
        0 30px 70px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
    margin-bottom: 20px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.title-card {
    width: 90%;
    max-width: 500px;
    text-align: center;
    background: linear-gradient(145deg, rgba(77, 71, 71, 0.98), rgba(25, 25, 25, 0.96));
}

.title-card h1 {
    font-size: 35px;
    font-weight: 500;
    letter-spacing: -1px;
    margin-bottom: 8px;
}

.title-card p {
    color: #b3b3b3;
    font-size: 16px;
    letter-spacing: -0.2px;
}

.playlist-card {
    width: fit-content;
    display: flex;
    justify-content: center;
    align-items: center;
}

.spotify-embed {
    width: 100%;
    max-width: 500px;
    display: flex;
    justify-content: center;
}

.carousel {
    position: relative;
    width: 1100px;
    max-width: 100%;
    height: 430px;
    overflow: hidden;
}

.slides {
    position: relative;
    width: 100%;
    height: 100%;
}

.slide {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.75);
    opacity: 0.35;
    transition: 0.5s ease;
}

.slide.active {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
    z-index: 2;
}

.slide.previous {
    transform: translate(calc(-50% - 380px), -50%) scale(0.75);
}

.slide.next {
    transform: translate(calc(-50% + 380px), -50%) scale(0.75);
}

.arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 5;

    width: 45px;
    height: 45px;

    border: none;
    border-radius: 50%;

    background: rgba(255,255,255,0.12);
    color: white;

    font-size: 28px;
    cursor: pointer;
}

.arrow:hover {
    background: rgba(255,255,255,0.2);
}

.arrow.left {
    left: 20px;
}

.arrow.right {
    right: 20px;
}

.add-playlist {
    margin-top: 10px;
    padding: 12px 22px;

    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 30px;

    background: rgba(255,255,255,0.08);
    color: white;

    font-family: inherit;
    font-size: 14px;

    cursor: pointer;
    transition: 0.3s ease;
}

.add-playlist:hover {
    transform: translateY(-3px);
    background: rgba(255,255,255,0.14);
}

.title-card:hover,
.playlist-card:hover {
    transform: translateY(-6px);
    box-shadow:
        0 20px 35px rgba(0, 0, 0, 0.5),
        0 35px 80px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
}

.title-animation,
.playlist-animation {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.title-animation { animation: fadeUp 0.8s ease-out both; }
.playlist-animation { animation: fadeUp 0.8s ease-out 0.15s both; }

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 600px) {
    body { padding: 20px 10px; gap: 15px; }
    .title-card { width: 100%; padding: 30px 20px; }
    .title-card h1 { font-size: 28px; }
    .playlist-card { width: 100%; padding: 20px; }
    .spotify-embed { width: 100%; }

    /* --- ADD THIS PART --- */
    .carousel {
        width: 100vw;
        height: 260px;
    }

    .slide.previous,
    .slide.next {
        display: none; /* no room to peek side-slides on mobile */
    }

    .slide.far-previous {
    transform: translate(calc(-50% - 760px), -50%) scale(0.65);
    opacity: 0;
}

.slide.far-next {
    transform: translate(calc(-50% + 760px), -50%) scale(0.65);
    opacity: 0;
}

    .slide.active {
        transform: translate(-50%, -50%) scale(1);
    }

    .playlist-card iframe {
        width: 90vw;
        max-width: 340px;
        height: 232px;
    }

    .arrow {
        width: 36px;
        height: 36px;
        font-size: 20px;
    }

    .arrow.left { left: 8px; }
    .arrow.right { right: 8px; }
}

body {
    overflow-x: hidden;
}

.add-popup {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    justify-content: center;
    align-items: center;
    z-index: 20;
}

.popup-box {
    width: 90%;
    max-width: 400px;
    padding: 30px;
    border-radius: 20px;
    background: linear-gradient(145deg, #343030, #191919);
    box-shadow: 0 20px 70px rgba(0,0,0,0.6);
}

.popup-box h2 {
    margin-bottom: 20px;
}

.popup-box input {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);
    background: #111;
    color: white;
}

.popup-box button {
    padding: 10px 16px;
    margin-right: 8px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.popup-box small {
    display: block;
    color: #999;
    font-size: 12px;
    margin: -6px 0 14px;
}

</style>
</head>
<body>

<div class="title-animation">
    <div class="title-card">
        <h1>MY SPOTIFY ROOM</h1>
    </div>
</div>

<div class="playlist-animation">

    <div class="carousel">

        <button class="arrow left" onclick="moveSlide(-1)">‹</button>

        <div class="slides" id="slides"></div>

        <button class="arrow right" onclick="moveSlide(1)">›</button>
     </div>

        <button class="add-playlist" onclick="openPopup()">
            + Add Playlist
        </button>

    <div class="add-popup" id="addPopup">
        <div class="popup-box">
            <h2>Add Playlist</h2>

            <input id="playlistName" type="text" placeholder="Playlist name">
            <input id="playlistUrl" type="text" placeholder="Spotify playlist link">
            <button onclick="addPlaylist()">Add</button>
            <button onclick="closePopup()">Cancel</button>
        </div>
    </div>

<script>
const SUPABASE_URL = "https://ihjlpqplpdoqqzuqwjzg.supabase.co";
const SUPABASE_KEY = "sb_publishable_y5cucyPlATIwRJd1hd2caA_zzSmxyus";
</script>

<script>
let current = 0, playlists = [], moving = false;
const slidesBox = document.getElementById("slides");

function spotifyURL(url) {
    return url.replace("open.spotify.com/playlist/", "open.spotify.com/embed/playlist/");
}

function index(i) {
    return (i + playlists.length) % playlists.length;
}

function createSlide(i) {
    const slide = document.createElement("div");
    slide.className = "slide";
    slide.dataset.index = i;

    slide.innerHTML = `
        <div class="playlist-card">
            <iframe
                src="${spotifyURL(playlists[i].spotify_url)}"
                width="500"
                height="352"
                frameborder="0"
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
            </iframe>
        </div>`;

    return slide;
}

function setupCarousel() {
    slidesBox.innerHTML = "";
    if (!playlists.length) return;

    // Keep 5 playlists ready: 2 left, current, 2 right
    for (let i = -2; i <= 2; i++)
        slidesBox.appendChild(createSlide(index(current + i)));

    updatePositions();
}

function updatePositions() {
    const total = playlists.length;

    [...slidesBox.children].forEach(slide => {
        const i = Number(slide.dataset.index);
        let d = (i - current + total) % total;

        if (d > total / 2) d -= total;

        slide.className = "slide";

        if (d === 0) slide.classList.add("active");
        else if (d === -1) slide.classList.add("previous");
        else if (d === 1) slide.classList.add("next");
        else if (d === -2) slide.classList.add("far-previous");
        else if (d === 2) slide.classList.add("far-next");
    });
}

function moveSlide(direction) {
    if (moving || playlists.length < 2) return;
    moving = true;

    const oldCurrent = current;
    current = index(current + direction);

    // First move the already-loaded cards
    updatePositions();

    setTimeout(() => {
        const wanted = [];

        for (let i = -2; i <= 2; i++)
            wanted.push(index(current + i));

        // Reuse only cards that are outside our 5-card window
        [...slidesBox.children].forEach(slide => {
            const oldIndex = Number(slide.dataset.index);

            if (!wanted.includes(oldIndex)) {
                const newIndex = direction > 0
                    ? index(current + 2)
                    : index(current - 2);

                slide.dataset.index = newIndex;
                slide.querySelector("iframe").src =
                    spotifyURL(playlists[newIndex].spotify_url);
            }
        });

        // Fix positions without disturbing visible cards
        updatePositions();
        moving = false;
    }, 520);
}

function openPopup() {
    document.getElementById("addPopup").style.display = "flex";
}

function closePopup() {
    document.getElementById("addPopup").style.display = "none";
}

async function addPlaylist() {
    const name = document.getElementById("playlistName").value.trim();
    let url = document.getElementById("playlistUrl").value.trim();

    if (!name || !url) {
        alert("Please fill in both fields.");
        return;
    }

    url = spotifyURL(url);

    const res = await fetch(`${SUPABASE_URL}/rest/v1/playlists`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`
        },
        body: JSON.stringify({ name, spotify_url: url })
    });

    if (!res.ok) {
        alert("Supabase error: " + await res.text());
        return;
    }

    closePopup();
    document.getElementById("playlistName").value = "";
    document.getElementById("playlistUrl").value = "";

    await loadPlaylists();
}

async function loadPlaylists() {
    const res = await fetch(
        `${SUPABASE_URL}/rest/v1/playlists?select=id,name,spotify_url&order=created_at.asc`,
        {
            headers: {
                apikey: SUPABASE_KEY,
                Authorization: `Bearer ${SUPABASE_KEY}`
            }
        }
    );

    if (!res.ok) {
        console.error("Supabase error:", await res.text());
        return;
    }

    playlists = await res.json();
    current = 0;
    setupCarousel();
}

loadPlaylists();
</script>

</div>
</body>
</html>
